<svg class="art" data-seconds="6" viewBox="0 0 720 260" role="img" aria-label="A table is built row by row. th is a header cell, tr is a row, td is one cell">
<style>
  .tg { transform-box: fill-box; }
  .anim.on .tg-r { animation: tg-in 0.6s both; }
  .anim.on .tg-r2 { animation-delay: 0.8s; }
  .anim.on .tg-r3 { animation-delay: 1.6s; }
  .anim.on .tg-l1 { animation: tg-fade 0.6s 2.6s both; }
  .anim.on .tg-l2 { animation: tg-fade 0.6s 3.4s both; }
  .anim.on .tg-l3 { animation: tg-fade 0.6s 4.2s both; }
  @keyframes tg-in { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: none; } }
  @keyframes tg-fade { from { opacity: 0; } to { opacity: 1; } }
</style>
<g font-family="Arial, sans-serif" font-size="20" text-anchor="middle">
  <g class="tg tg-r tg-r1" font-weight="700" fill="#fff">
    <rect x="20" y="30" width="460" height="60" fill="#1d5fd1"/>
    <text x="96" y="68">Day</text><text x="250" y="68">Morning</text><text x="404" y="68">Evening</text>
  </g>
  <g class="tg tg-r tg-r2" fill="#1f2a37">
    <rect x="20" y="90" width="460" height="60" fill="#fff" stroke="#c9d6ee" stroke-width="2"/>
    <text x="96" y="128">Monday</text><text x="250" y="128">School</text><text x="404" y="128">Football</text>
  </g>
  <g class="tg tg-r tg-r3" fill="#1f2a37">
    <rect x="20" y="150" width="460" height="60" fill="#f4f8ff" stroke="#c9d6ee" stroke-width="2"/>
    <text x="96" y="188">Tuesday</text><text x="250" y="188">School</text><text x="404" y="188">Chess</text>
  </g>
  <path d="M173 30 v180 M327 30 v180" stroke="#c9d6ee" stroke-width="2"/>
</g>
<g font-family="Arial, sans-serif" font-size="17" font-weight="700">
  <g class="tg tg-l1"><text x="500" y="66" fill="#1d5fd1">&lt;th&gt; header cell</text></g>
  <g class="tg tg-l2"><path d="M14 150 v60 M486 150 v60" stroke="#e0a800" stroke-width="5"/><text x="500" y="186" fill="#b07d00">&lt;tr&gt; one row</text></g>
  <g class="tg tg-l3"><rect x="327" y="90" width="153" height="60" fill="none" stroke="#16794a" stroke-width="5"/><text x="500" y="126" fill="#16794a">&lt;td&gt; one cell</text></g>
  <text x="250" y="245" text-anchor="middle" font-family="Menlo, monospace" font-size="15" font-weight="400" fill="#5b6676">&lt;table&gt; holds everything</text>
</g>
</svg>
