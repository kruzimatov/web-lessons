<svg class="art" data-seconds="6" viewBox="0 0 720 260" role="img" aria-label="iframe opens a window to another website inside your page. video plays a film. audio plays a sound">
<style>
  .ew { transform-box: fill-box; }
  .anim.on .ew-win { transform-origin: center; animation: ew-open 0.9s 0.3s both; }
  .anim.on .ew-play { transform-origin: center; animation: ew-pulse 1s 1.3s 3 both; }
  .anim.on .ew-vid { animation: ew-fade 0.6s 2.4s both; }
  .anim.on .ew-bar { transform-origin: left; animation: ew-bar 2.5s 3s both linear; }
  .anim.on .ew-aud { animation: ew-fade 0.6s 3.2s both; }
  .anim.on .ew-wave { animation: ew-fade 0.4s 3.8s 4 alternate both; }
  @keyframes ew-open { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: none; } }
  @keyframes ew-pulse { 0%, 100% { transform: none; } 50% { transform: scale(1.18); } }
  @keyframes ew-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ew-bar { from { transform: scaleX(0); } to { transform: none; } }
</style>
<g font-family="Arial, sans-serif">
  <rect x="20" y="10" width="330" height="240" rx="12" fill="#fff" stroke="#1f2a37" stroke-width="3"/>
  <text x="40" y="45" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#1f2a37">My page</text>
  <g class="ew ew-win">
    <rect x="40" y="62" width="290" height="160" rx="8" fill="#1f2a37"/>
    <circle class="ew ew-play" cx="185" cy="142" r="30" fill="#c0392b"/>
    <path d="M176 127 l26 15 l-26 15 z" fill="#fff"/>
  </g>
  <text x="185" y="242" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#5b6676">&lt;iframe&gt; = a window</text>

  <g class="ew ew-vid">
    <rect x="390" y="20" width="310" height="120" rx="10" fill="#e8f0ff" stroke="#1d5fd1" stroke-width="2"/>
    <text x="410" y="52" font-family="Menlo, monospace" font-size="16" font-weight="700" fill="#1d5fd1">&lt;video&gt;</text>
    <path d="M412 104 l14 8 l-14 8 z" fill="#1d5fd1"/>
    <rect x="440" y="108" width="240" height="8" rx="4" fill="#c9d6ee"/>
    <rect class="ew ew-bar" x="440" y="108" width="240" height="8" rx="4" fill="#1d5fd1"/>
  </g>
  <g class="ew ew-aud">
    <rect x="390" y="150" width="310" height="100" rx="10" fill="#e3f6ec" stroke="#16794a" stroke-width="2"/>
    <text x="410" y="182" font-family="Menlo, monospace" font-size="16" font-weight="700" fill="#16794a">&lt;audio&gt;</text>
    <path d="M420 205 h14 l16 -14 v42 l-16 -14 h-14 z" fill="#16794a"/>
    <g class="ew ew-wave" fill="none" stroke="#16794a" stroke-width="4" stroke-linecap="round">
      <path d="M462 200 q8 12 0 24"/><path d="M474 192 q14 20 0 40"/>
    </g>
    <text x="500" y="218" font-family="Arial, sans-serif" font-size="17" fill="#1f2a37">Roar!</text>
  </g>
</g>
</svg>
