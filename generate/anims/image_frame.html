<svg class="art" data-seconds="6" viewBox="0 0 720 260" role="img" aria-label="src is the picture file, width is how wide it is, alt is the text that shows when the picture cannot load">
<style>
  .if { transform-box: fill-box; }
  .anim.on .if-code { animation: if-fade 0.6s both; }
  .anim.on .if-pic { transform-origin: center; animation: if-pop 0.8s 0.9s both; }
  .anim.on .if-w { transform-origin: left; animation: if-grow 0.7s 2s both; }
  .anim.on .if-broken { animation: if-fade 0.8s 3.4s both; }
  @keyframes if-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes if-pop { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: none; } }
  @keyframes if-grow { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: none; } }
</style>
<g class="if if-code" font-family="Menlo, monospace" font-size="17">
  <rect x="20" y="8" width="680" height="40" rx="8" fill="#1e2530"/>
  <text x="36" y="34" fill="#e9edf2">&lt;img <tspan fill="#ffb347">src="dog.jpg"</tspan> <tspan fill="#7ee2a8">alt="A puppy"</tspan> <tspan fill="#8ab4ff">width="200"</tspan>&gt;</text>
</g>
<g class="if if-pic">
  <rect x="40" y="70" width="240" height="150" rx="8" fill="#e8f0ff" stroke="#1f2a37" stroke-width="3"/>
  <circle cx="230" cy="105" r="18" fill="#e0a800"/>
  <path d="M40 220 l70 -80 l50 55 l35 -35 l85 60 z" fill="#16794a"/>
  <text x="160" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#b45309">src: the picture</text>
</g>
<g class="if if-w">
  <line x1="40" y1="62" x2="280" y2="62" stroke="#1d5fd1" stroke-width="3"/>
  <path d="M40 56 v12 M280 56 v12" stroke="#1d5fd1" stroke-width="3"/>
  <text x="300" y="68" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d5fd1">width</text>
</g>
<g class="if if-broken" font-family="Arial, sans-serif">
  <rect x="420" y="70" width="240" height="150" rx="8" fill="#fff" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M440 90 h22 v18 h-22 z M442 104 l7 -7 l5 5 l4 -4 l4 6" fill="none" stroke="#5b6676" stroke-width="2"/>
  <text x="472" y="105" font-size="20" fill="#1f2a37">A puppy</text>
  <text x="540" y="160" text-anchor="middle" font-size="15" fill="#c0392b">Picture missing?</text>
  <text x="540" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#16794a">alt: the words you see instead</text>
</g>
</svg>
