<svg class="art" data-seconds="5" viewBox="0 0 720 260" role="img" aria-label="ul makes a list with dots. ol makes a list with numbers 1, 2, 3">
<style>
  .lb { transform-box: fill-box; }
  .anim.on .lb { animation: lb-drop 0.6s both; }
  .anim.on .lb2 { animation-delay: 0.6s; }
  .anim.on .lb3 { animation-delay: 1.2s; }
  .anim.on .lb4 { animation-delay: 2.2s; }
  .anim.on .lb5 { animation-delay: 2.8s; }
  .anim.on .lb6 { animation-delay: 3.4s; }
  @keyframes lb-drop { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: none; } }
</style>
<g font-family="Arial, sans-serif">
  <rect x="20" y="20" width="320" height="220" rx="14" fill="#e8f0ff"/>
  <text x="40" y="58" font-family="Menlo, monospace" font-size="22" font-weight="700" fill="#1d5fd1">&lt;ul&gt;</text>
  <text x="320" y="58" text-anchor="end" font-size="15" font-weight="700" fill="#1d5fd1">dots</text>
  <g class="lb lb1"><circle cx="60" cy="100" r="7" fill="#1f2a37"/><text x="80" y="108" font-size="24" fill="#1f2a37">Apples</text></g>
  <g class="lb lb2"><circle cx="60" cy="150" r="7" fill="#1f2a37"/><text x="80" y="158" font-size="24" fill="#1f2a37">Milk</text></g>
  <g class="lb lb3"><circle cx="60" cy="200" r="7" fill="#1f2a37"/><text x="80" y="208" font-size="24" fill="#1f2a37">Bread</text></g>

  <rect x="380" y="20" width="320" height="220" rx="14" fill="#e3f6ec"/>
  <text x="400" y="58" font-family="Menlo, monospace" font-size="22" font-weight="700" fill="#16794a">&lt;ol&gt;</text>
  <text x="680" y="58" text-anchor="end" font-size="15" font-weight="700" fill="#16794a">numbers</text>
  <g class="lb lb4"><text x="410" y="108" font-size="24" font-weight="700" fill="#16794a">1.</text><text x="445" y="108" font-size="24" fill="#1f2a37">Wake up</text></g>
  <g class="lb lb5"><text x="410" y="158" font-size="24" font-weight="700" fill="#16794a">2.</text><text x="445" y="158" font-size="24" fill="#1f2a37">Brush teeth</text></g>
  <g class="lb lb6"><text x="410" y="208" font-size="24" font-weight="700" fill="#16794a">3.</text><text x="445" y="208" font-size="24" fill="#1f2a37">Go to school</text></g>
</g>
</svg>
