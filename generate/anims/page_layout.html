<svg class="art" data-seconds="5" viewBox="0 0 720 260" role="img" aria-label="A page is built from header at the top, nav for the menu, main for the content, and footer at the bottom">
<style>

  .anim.on .pl-note { animation: pl-fade 0.8s 3s both; }
  @keyframes pl-in { from { opacity: 0; transform: translateY(-24px); } to { opacity: 1; transform: none; } }
  @keyframes pl-fade { from { opacity: 0; } to { opacity: 1; } }
</style>

  <g class="pl pl-b pl-b3"><rect x="20" y="100" width="380" height="104" rx="8" fill="#e3f6ec" stroke="#16794a" stroke-width="2"/><text x="36" y="126" fill="#16794a">&lt;main&gt;</text>
    <rect x="36" y="136" width="166" height="56" rx="6" fill="#fff" stroke="#16794a"/><text x="48" y="168" font-size="13" fill="#16794a">&lt;section&gt;</text>

</g>
<g class="pl pl-note" font-family="Arial, sans-serif" font-size="17" fill="#1f2a37">
  <text x="430" y="40" font-weight="700" fill="#1d5fd1">header: the top</text>
  <text x="430" y="85" font-weight="700" fill="#3a6fd6">nav: the menu</text>

  <text x="430" y="236" font-weight="700" fill="#5b6676">footer: the bottom</text>
