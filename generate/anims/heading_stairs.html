<svg class="art" data-seconds="3.5" viewBox="0 0 720 260" role="img" aria-label="Six stairs: h1 is the biggest, then h2, h3, h4, h5, and h6 is the smallest">

  .anim.on .hs5 { animation-delay: 2s; }

</style>
