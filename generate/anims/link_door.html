<svg class="art" data-seconds="6" viewBox="0 0 720 260" role="img" aria-label="Click a blue link on one page and the browser opens another page">

  .anim.on .ld-go { animation: ld-go 6s both; }
  .anim.on .ld-tab { animation: ld-tab 6s both; }
  @keyframes ld-move { 0%, 8% { transform: translate(120px, 90px); } 35%, 100% { transform: none; } }
  @keyframes ld-pulse { 0%, 36% { opacity: 0; transform: scale(0.3); } 42% { opacity: 1; transform: scale(1); } 50%, 100% { opacity: 0; transform: scale(1.6); } }
  @keyframes ld-go { 0%, 48% { opacity: 0; transform: translateX(-40px); } 64%, 100% { opacity: 1; transform: none; } }
  @keyframes ld-tab { 0%, 72% { opacity: 0; } 85%, 100% { opacity: 1; } }
</style>
