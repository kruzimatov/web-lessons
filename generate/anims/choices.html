<svg class="art" data-seconds="6" viewBox="0 0 720 260" role="img" aria-label="Checkboxes: you can tick many. Radio buttons: only one, the dot jumps. Select: a list opens and you pick one">
<style>
  .ch { transform-box: fill-box; }
  .ch-r1, .ch-start, .ch-list { opacity: 0; }
  .anim.on .ch-t1 { animation: ch-in 0.3s 0.5s both; }
  .anim.on .ch-t2 { animation: ch-in 0.3s 1.1s both; }
  .anim.on .ch-r1 { animation: ch-out 3s 0.8s both; }
  .anim.on .ch-r2 { animation: ch-in 0.3s 2.2s both; }
  .anim.on .ch-list { transform-origin: top; animation: ch-list 6s both; }
  .anim.on .ch-pick { animation: ch-in 0.3s 4.2s both; }
  .anim.on .ch-start { animation: ch-out2 6s both; }
  @keyframes ch-in { from { opacity: 0; transform: scale(0.2); } to { opacity: 1; transform: none; } }
  @keyframes ch-out { 0%, 45% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes ch-out2 { 0%, 68% { opacity: 1; } 70%, 100% { opacity: 0; } }
  @keyframes ch-list { 0%, 50% { opacity: 0; transform: scaleY(0); } 58%, 66% { opacity: 1; transform: none; } 70%, 100% { opacity: 0; transform: scaleY(0); } }
</style>
<g font-family="Arial, sans-serif" font-size="19" fill="#1f2a37">
  <text x="20" y="34" font-family="Menlo, monospace" font-size="15" font-weight="700" fill="#1d5fd1">checkbox</text>
  <text x="20" y="56" font-size="14" fill="#5b6676">tick many</text>
  <g stroke="#1d5fd1" stroke-width="3" fill="#fff">
    <rect x="20" y="80" width="26" height="26" rx="5"/><rect x="20" y="130" width="26" height="26" rx="5"/><rect x="20" y="180" width="26" height="26" rx="5"/>
  </g>
  <path class="ch ch-t1" d="M25 93 l6 7 l11 -14" fill="none" stroke="#16794a" stroke-width="4"/>
  <path class="ch ch-t2" d="M25 193 l6 7 l11 -14" fill="none" stroke="#16794a" stroke-width="4"/>
  <text x="58" y="100">Football</text><text x="58" y="150">Chess</text><text x="58" y="200">Lego</text>

  <text x="260" y="34" font-family="Menlo, monospace" font-size="15" font-weight="700" fill="#1d5fd1">radio</text>
  <text x="260" y="56" font-size="14" fill="#5b6676">only one</text>
  <g stroke="#1d5fd1" stroke-width="3" fill="#fff">
    <circle cx="273" cy="93" r="13"/><circle cx="273" cy="143" r="13"/><circle cx="273" cy="193" r="13"/>
  </g>
  <circle class="ch ch-r1" cx="273" cy="93" r="6" fill="#16794a"/>
  <circle class="ch ch-r2" cx="273" cy="143" r="6" fill="#16794a"/>
  <text x="298" y="100">Small</text><text x="298" y="150">Medium</text><text x="298" y="200">Large</text>

  <text x="480" y="34" font-family="Menlo, monospace" font-size="15" font-weight="700" fill="#1d5fd1">select</text>
  <text x="480" y="56" font-size="14" fill="#5b6676">pick from a list</text>
  <rect x="480" y="76" width="220" height="40" rx="8" fill="#fff" stroke="#1d5fd1" stroke-width="3"/>
  <path d="M676 92 l8 8 l8 -8" fill="none" stroke="#1d5fd1" stroke-width="3"/>
  <text class="ch ch-start" x="494" y="102" fill="#5b6676">Choose a pet</text>
  <text class="ch ch-pick" x="494" y="102" font-weight="700">Cat</text>
  <g class="ch ch-list">
    <rect x="480" y="118" width="220" height="120" rx="8" fill="#fff" stroke="#1d5fd1" stroke-width="2"/>
    <rect x="482" y="160" width="216" height="38" fill="#e8f0ff"/>
    <text x="494" y="146">Dog</text><text x="494" y="186" font-weight="700">Cat</text><text x="494" y="226">Fish</text>
  </g>
</g>
</svg>
