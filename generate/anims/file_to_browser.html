<svg class="art" data-seconds="6" viewBox="0 0 720 260" role="img" aria-label="The file index.html goes into Chrome, and Chrome shows it as a page">
<style>
  .fb-file, .fb-arrow, .fb-win, .fb-page { transform-box: fill-box; }
  .anim.on .fb-file { animation: fb-file 6s both; }
  .anim.on .fb-arrow { animation: fb-arrow 6s both; }
  .anim.on .fb-win { animation: fb-win 6s both; }
  .anim.on .fb-page { animation: fb-page 6s both; }
  @keyframes fb-file { 0% { opacity: 0; transform: translateY(-60px); } 18%, 100% { opacity: 1; transform: none; } }
  @keyframes fb-arrow { 0%, 22% { opacity: 0; transform: translateX(-30px); } 38%, 100% { opacity: 1; transform: none; } }
  @keyframes fb-win { 0%, 38% { opacity: 0; transform: scale(0.85); } 52%, 100% { opacity: 1; transform: none; } }
  @keyframes fb-page { 0%, 56% { opacity: 0; } 75%, 100% { opacity: 1; } }
</style>
<g class="fb-file">
  <path d="M60 30 h110 l40 40 v160 h-150 z" fill="#fff" stroke="#1f2a37" stroke-width="3"/>
  <path d="M170 30 v40 h40" fill="none" stroke="#1f2a37" stroke-width="3"/>
  <text x="72" y="105" font-family="Menlo, monospace" font-size="15" fill="#1d5fd1">&lt;h1&gt;Hi&lt;/h1&gt;</text>
  <text x="72" y="135" font-family="Menlo, monospace" font-size="15" fill="#1d5fd1">&lt;p&gt;I am 8&lt;/p&gt;</text>
  <text x="135" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2a37">index.html</text>
</g>
<g class="fb-arrow">
  <line x1="230" y1="130" x2="300" y2="130" stroke="#16794a" stroke-width="6" stroke-linecap="round"/>
  <path d="M296 116 l20 14 l-20 14 z" fill="#16794a"/>
  <text x="270" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#16794a" font-weight="700">Chrome reads it</text>
</g>
<g class="fb-win">
  <rect x="340" y="20" width="350" height="215" rx="12" fill="#fff" stroke="#1f2a37" stroke-width="3"/>
  <path d="M340 32 a12 12 0 0 1 12 -12 h326 a12 12 0 0 1 12 12 v18 h-350 z" fill="#e8f0ff"/>
  <circle cx="360" cy="35" r="6" fill="#c0392b"/>
  <circle cx="380" cy="35" r="6" fill="#e0a800"/>
  <circle cx="400" cy="35" r="6" fill="#16794a"/>
  <rect x="420" y="26" width="250" height="18" rx="9" fill="#fff"/>
  <text x="432" y="40" font-family="Arial, sans-serif" font-size="12" fill="#5b6676">index.html</text>
</g>
<g class="fb-page">
  <text x="365" y="110" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#1f2a37">Hi</text>
  <text x="365" y="150" font-family="Georgia, serif" font-size="20" fill="#1f2a37">I am 8</text>
  <text x="515" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#16794a" font-weight="700">You see a page!</text>
</g>
</svg>
